<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/admin/admin.css?v=1.0.1">
    <link rel="stylesheet" href="/site-theme.css?v=1">
</head>

<body>
    <!-- Login Screen -->
    <div id="admin-login-screen" class="login-screen">
        <div class="login-card">
            <h1><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-shield"></use></svg> Admin Access</h1>
            <form id="admin-login-form">
                <div class="admin-input-wrapper">
                    <input type="text" id="admin-user" placeholder="Username" required>
                </div>
                <div class="admin-input-wrapper">
                    <input type="password" id="admin-pass" placeholder="Password" required>
                    <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility('admin-pass', this)"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-eye"></use></svg></button>
                </div>
                <div class="admin-input-wrapper">
                    <input type="password" id="admin-secret" placeholder="Secret Key" required>
                    <button type="button" class="password-toggle-btn" aria-label="Show secret key" onclick="togglePasswordVisibility('admin-secret', this)"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-eye"></use></svg></button>
                </div>
                <button type="submit" class="btn">Login</button>
                <p id="login-error" class="error"></p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="admin-dashboard" class="dashboard" style="display: none;">
        <button id="admin-mobile-menu" class="admin-mobile-menu-btn" type="button" aria-label="Open navigation" aria-expanded="false"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-menu"></use></svg></button>
        <aside class="sidebar">
            <h2><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-ghost"></use></svg> Primal Admin</h2>
            <nav>
                <button class="nav-btn active" data-tab="overview"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-chart"></use></svg> Overview</button>
                <button class="nav-btn" data-tab="rooms"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-door"></use></svg> Rooms</button>
                <button class="nav-btn" data-tab="monitor"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-eye"></use></svg> Monitor</button>
                <button class="nav-btn" data-tab="config"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-settings"></use></svg> Config</button>
                <button class="nav-btn" data-tab="bots"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-robot"></use></svg> Bots</button>
            </nav>
            <button id="logout-btn" class="btn btn-logout"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-logout"></use></svg> Logout</button>
        </aside>

        <main class="main-content">
            <!-- Overview Tab -->
            <section id="tab-overview" class="tab-content active">
                <h2>Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card" style="border-left: 4px solid #10b981;">
                        <svg class="ui-icon" aria-hidden="true" style="color: #10b981;"><use href="/icons.svg#icon-users"></use></svg>
                        <div class="stat-info">
                            <span id="stat-users">0</span>
                            <label>Active Users</label>
                        </div>
                    </div>
                    <div class="stat-card" style="border-left: 4px solid #f97316;">
                        <svg class="ui-icon" aria-hidden="true" style="color: #f97316;"><use href="/icons.svg#icon-spark"></use></svg>
                        <div class="stat-info">
                            <span id="stat-online-rooms">0</span>
                            <label>Online Rooms</label>
                        </div>
                    </div>
                    <div class="stat-card" style="border-left: 4px solid #6366f1;">
                        <svg class="ui-icon" aria-hidden="true" style="color: #6366f1;"><use href="/icons.svg#icon-door"></use></svg>
                        <div class="stat-info">
                            <span id="stat-total-rooms">0</span>
                            <label>Total Rooms</label>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Rooms Tab -->
            <section id="tab-rooms" class="tab-content">
                <h2>Room Management</h2>
                <div class="room-controls">
                    <input type="text" id="new-room-name" placeholder="New Room Name">
                    <button id="add-room-btn" class="btn"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-plus"></use></svg> Create</button>
                </div>
                <ul id="admin-room-list" class="admin-room-list"></ul>
            </section>

            <!-- Monitor Tab -->
            <section id="tab-monitor" class="tab-content">
                <h2>Live Monitor</h2>
                <div class="monitor-layout">
                    <div class="monitor-private-join">
                        <select id="monitor-room-select" style="flex: 1; min-width: 150px;">
                            <option value="">Select a Room</option>
                        </select>
                        <span>or</span>
                        <input type="text" id="monitor-private-id" placeholder="Private Room ID" maxlength="8">
                        <input type="password" id="monitor-private-pass" placeholder="Password">
                        <button id="monitor-private-btn" class="btn" style="margin: 0; padding: 10px 15px;"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-sign-in"></use></svg> Join Private</button>
                    </div>
                    <div class="chat-viewport" id="monitor-messages">
                        <!-- Messages render here -->
                    </div>
                    <div class="admin-chat-area" id="admin-chat-input-area"
                        style="display: none; padding: 10px; background: #222; gap: 10px; align-items:center;">
                        <input type="text" id="admin-chat-input" placeholder="Message as Moderator..."
                            style="flex:1; padding: 10px; border-radius: 4px; border:none;">
                        <button id="admin-chat-btn"
                            style="padding: 10px 20px; background: gold; color: #000; border:none; font-weight: bold; cursor: pointer;">SEND</button>
                        <button id="admin-unpin-btn"
                            style="padding: 10px; background: #ff4757; color: white; border:none; border-radius:4px; cursor: pointer; font-weight:bold;"
                            title="Unpin Active Message"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-unlink"></use></svg> UNPIN</button>
                    </div>
                </div>
            </section>

            <!-- Config Tab -->
            <section id="tab-config" class="tab-content">
                <h2>Configuration</h2>
                <div class="config-grid">
                    <div class="config-item">
                        <label>Message TTL (0 = Never Delete)</label>
                        <input type="range" id="config-ttl" min="0" max="3600" value="0">
                        <span id="ttl-val">0s (Never)</span>
                    </div>
                    <div class="config-item">
                        <label>Spam Limit (seconds)</label>
                        <input type="range" id="config-spam" min="1" max="30" value="3">
                        <span id="spam-val">3s</span>
                    </div>
                    <button id="save-config-btn" class="btn"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#icon-save"></use></svg> Save Changes</button>
                </div>
            </section>

            <!-- Bots Tab -->
            <section id="tab-bots" class="tab-content">
                <h2>Bot Management</h2>
                <div class="bot-control-card">
                    <div class="bot-status-row">
                        <div class="bot-status-indicator">
                            <span id="bot-status-dot" class="status-dot offline"></span>
                            <span id="bot-status-text">Checking...</span>
                        </div>
                        <button id="bot-toggle-btn" class="btn">Enable Bots</button>
                    </div>
                    <div class="bot-info-row">
                        <span id="bot-gemini-status" style="color:#888; font-size:0.85rem;"></span>
                    </div>
                </div>
                <h3 style="color:#e94560; margin:20px 0 10px;">Active Bots</h3>
                <ul id="bot-list" class="admin-room-list"></ul>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/admin/admin.js?v=1.0.1"></script>
</body>

</html>
